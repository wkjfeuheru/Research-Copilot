# 示例报告规则。正式使用前必须由研究员替换风险提示与免责声明文本。
# M4 只消费 risk_warning_template 与 disclaimer_template；
# sensitive_words / required_disclosures / prohibited_patterns 为 M5 预留，M4 只校验结构。
version: 1

sensitive_words: []
required_disclosures:
  - risk_warning
  - disclaimer
prohibited_patterns:
  - "保证.{0,4}收益"
  - "稳赚|必涨|零风险"

risk_warning_template: |
  【示例规则，需研究员替换】本报告基于公开资料与已授权数据整理，可能存在数据时点、
  口径与完整性限制；相关判断不构成对未来业绩的保证。

disclaimer_template: |
  【示例规则，需研究员替换】本报告仅供研究参考，不构成任何投资建议、要约或承诺。
  研究员与使用者应自行核验数据并独立判断。
