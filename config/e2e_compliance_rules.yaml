# 仅供显式 test 模式的受控验收，不代表研究员已批准的生产规则。
# 风险提示、免责声明和禁止措辞仍为必检项。
version: 1
test_only: true

sensitive_words: []
required_disclosures:
  - risk_warning
  - disclaimer
prohibited_patterns:
  - "保证.{0,4}收益"
  - "稳赚|必涨|零风险"

risk_warning_template: |
  本报告基于公开资料与已授权数据整理，可能存在数据时点、口径与完整性限制；
  相关判断不构成对未来业绩的保证。市场有风险，投资需谨慎。
disclaimer_template: |
  本报告仅供研究参考，不构成任何投资建议、要约或承诺。
  研究员与使用者应自行核验数据并独立判断。
