# 生产报告合规规则。
# 启用前须由研究员审阅风险提示与免责声明，并签署匹配规则版本和哈希的审批文件。
version: 1

sensitive_words: []

required_disclosures:
  - risk_warning
  - disclaimer

prohibited_patterns:
  - "保证.{0,4}收益"
  - "稳赚|必涨|零风险"
  - "包赚|稳赚不赔"

risk_warning_template: |
  【风险提示】本报告基于公开资料及已授权数据整理，可能存在数据时点、统计口径与完整性方面的限制；
  报告中的分析和判断不构成对未来业绩或市场表现的保证。市场有风险，投资需谨慎。

disclaimer_template: |
  【免责声明】本报告仅供研究参考，不构成任何投资建议、要约、要约邀请或承诺。
  报告使用者应自行核验数据并独立判断，据此操作风险自担。未经书面许可，不得复制、转发或用于其他用途。
