.chat-composer textarea{display:block;width:100%;border:0;resize:vertical;min-height:110px;max-height:240px;outline:none;color:var(--ink);padding:12px 2px;font-size:13px;line-height:1.9;background:white}
.chat-composer textarea::placeholder{color:#9ba6b2}.composer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding-top:10px;border-top:1px solid #f1f3f6}.composer-tool{display:flex;gap:6px;align-items:center;padding:6px 9px;font-size:11px;border-radius:5px;color:#667c95}.composer-tool span{font-size:18px}.composer-tool:hover,.composer-tool.selected{background:var(--pale);color:var(--accent)}
.send-message{width:33px;height:33px;display:grid;place-items:center;background:var(--accent);border-radius:8px;color:white;font-size:23px}.send-message:disabled{background:#c5d0dc;opacity:1}.chat-footnote{font-size:10px;text-align:center;color:#8b98a7;padding:13px 0;line-height:1.8}
.composer-files,.selected-skills{display:flex;gap:7px;flex-wrap:wrap}.attachment-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 8px;border-radius:6px;font-size:10px;max-width:100%;background:#fafbfd}.attachment-chip>span:nth-child(2){overflow-wrap:anywhere}.attachment-chip .file-icon{height:26px;width:26px;font-size:8px}.attachment-chip button{font-size:17px;color:var(--muted)}.selected-skills>button{font-size:10px;background:#edf3fa;color:var(--accent);padding:5px 8px;border-radius:4px}.selected-skills>button span{margin-left:7px}
.skill-picker{background:white;border:1px solid var(--line);border-radius:9px;padding:15px;box-shadow:0 9px 24px #19375913;margin-top:12px}.skill-picker strong{font-size:12px}.skill-picker p{margin:7px 0 10px}.skill-option{width:100%;display:grid;grid-template-columns:1fr 22px;text-align:left;padding:10px;border-radius:5px;margin:3px 0}.skill-option span{font-size:12px}.skill-option small{font-size:10px;color:var(--muted);grid-row:2;line-height:1.8}.skill-option b{grid-column:2;grid-row:1/3;align-self:center;font-weight:400}.skill-option:hover,.skill-option.chosen{background:var(--pale);color:var(--accent)}
.chat-context{padding:50px 0 0 4px}.context-block{border-top:1px solid var(--line);padding:19px 0;font-size:12px}.context-block p{font-size:11px;color:var(--muted);line-height:1.9;margin:12px 0 0}.context-path{display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--muted);padding:16px 0 0 8px}.context-path i{font-style:normal;color:#b2c0cf}.context-file{padding-top:13px;font-size:11px;overflow-wrap:anywhere}.context-file small{display:block;color:var(--muted);font-size:9px;margin:6px 0 0 14px}
.conversation{padding:30px 0 20px;display:flex;flex-direction:column;gap:29px}.message{font-size:13px}.message p{margin:12px 0 0;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}.user-message{align-self:flex-end;width:min(92%,650px);padding:16px 19px;background:#e7eef6;border-radius:10px 10px 2px 10px}.message-meta{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600}.message-meta>span:last-child{font-size:9px;color:var(--muted);font-weight:400}.assistant-mark{display:grid;place-items:center;width:24px;height:24px;background:var(--accent);border-radius:6px;color:white;font:19px Georgia}.message-files{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.message-files span{font-size:10px;background:#ffffffb0;border:1px solid #d2deea;padding:5px 8px;border-radius:4px;overflow-wrap:anywhere}.message-skills{font-size:10px;color:#68809b;margin-top:10px}.chat-plan{background:white;border:1px solid var(--line);border-radius:8px;padding:19px;margin-top:16px}.chat-plan strong{font-size:12px}.chat-plan ol{font-size:12px;color:#667786;padding-left:20px;line-height:2.1;margin:15px 0 18px}.chat-plan .row:last-child{padding-top:12px;border-top:1px solid var(--line)}
@media(max-width:1150px){.chat-layout{grid-template-columns:150px minmax(350px,1fr)}.chat-context{grid-column:2;padding-top:15px}.chat-context .context-path{flex-direction:row;align-items:center}.chat-context .context-path i{transform:rotate(-90deg)}}
@media(max-width:720px){.chat-layout{display:block}.chat-welcome{padding:32px 3px 25px}.chat-welcome h1{font-size:28px}.chat-emblem span{font-size:9px;letter-spacing:1px}.chat-titlebar{font-size:11px}.chat-titlebar>.tiny{font-size:9px}.suggestions{grid-template-columns:1fr;gap:8px;margin-top:22px}.suggestions button{padding:11px 29px 11px 13px}.suggestions span{margin-bottom:1px}.suggestions b{top:23px}.keyboard-hint{display:none}.chat-composer{padding:10px 12px}.chat-composer textarea{min-height:105px;font-size:14px}.chat-context{padding:20px 4px 0}.chat-plan{padding:14px}.chat-plan .row{flex-wrap:wrap}.user-message{width:94%}.chat-welcome .chat-emblem{margin-bottom:18px}.conversation{padding-top:23px}.chat-footnote{font-size:9px}}


.memory-notice{padding:15px 18px;background:var(--pale);border-radius:7px;color:var(--accent);font-size:12px;line-height:1.8;margin-bottom:24px}.experience-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.experience-card{border:1px solid var(--line);border-radius:8px;background:white;padding:23px}.experience-card h3{font-size:16px;line-height:1.6;margin:19px 0 10px}.experience-card p{font-size:12px;color:var(--muted);line-height:1.9}.experience-scope{background:#f6f8fb;padding:14px;border-radius:5px;margin:18px 0}.experience-scope strong{font-size:11px}.experience-scope p{margin:7px 0 0}.experience-card>.row:last-child{gap:15px}.experience-card>.row:last-child .tiny{overflow-wrap:anywhere}.reflection-banner{padding:18px;border:1px solid #cbd9e8;background:#f6f9fc;border-radius:8px;margin:18px 0}.reflection-banner strong{font-size:13px}.reflection-banner p{font-size:12px;color:var(--muted);margin:9px 0 13px}.ended-note{font-size:12px;color:var(--muted);padding:10px}.session-ended .composer-toolbar,.session-ended .selected-skills,.session-ended .composer-files,.session-ended .skill-picker,.session-ended textarea{display:none}@media(max-width:720px){.experience-grid{grid-template-columns:1fr}.reflection-banner>.row{flex-wrap:wrap}.chat-titlebar{gap:10px;flex-wrap:wrap}}

<body><div id="app"></div><div id="floating"></div><dialog id="modal"></dialog><div id="toast" role="status" hidden></div>
<script>
const variants={A:'三栏研究台',B:'简报阅读台',C:'研究流程台'};
const state={variant:new URLSearchParams(location.search).get('variant')||'B',view:'research',task:0,tab:'report',panel:'sources',source:0,chart:'growth',stage:5,status:'completed',memory:true,showState:false,uploads:[],query:'',skills:[true,true,false],notice:'',chatOpen:new URLSearchParams(location.search).get('view')==='new',chatTask:null,draft:'',draftFiles:[],draftSkills:[],skillPicker:false,memoryTab:'experience'};
if(!variants[state.variant])state.variant='A';
const tasks=[{title:'华辰制造：增长的质量',question:'营收增长背后，利润与现金流是否匹配？',symbol:'DEMO.A · 虚构公司',date:'今天 10:42',status:'completed'}, {title:'新能源设备：三家公司对比',question:'三家公司的增长、盈利与估值有何差异？',symbol:'行业对比 · 演示样本',date:'今天 09:18',status:'paused'}, {title:'消费行业：渠道库存观察',question:'渠道库存的变化如何影响经营质量？',symbol:'行业研究 · 演示样本',date:'昨天 16:30',status:'completed'}];
const sources=[{name:'华辰制造 2025 年年度报告',type:'PDF',detail:'演示附件 · 第 18–24 页',date:'2026-04-20',quote:'2025 年公司营业收入同比增长 18.6%。经营活动产生的现金流量净额增速低于净利润增速，主要受应收账款及存货增加影响。'}, {name:'财务指标与现金流数据',type:'数据',detail:'CNEquity · 演示查询快照',date:'2026-10-20',quote:'演示数据：营业收入增速 18.6%，净利润增速 15.2%，经营现金流增速 9.4%。单位与报告期在正式产品中需逐项核对。'}, {name:'装备制造行业景气跟踪',type:'研报',detail:'演示研究机构 · 第 6–8 页',date:'2026-09-30',quote:'演示观点：下游资本开支恢复可能带动设备订单，但交付周期及回款节奏仍需持续观察。'}, {name:'公司投资者交流纪要',type:'网页',detail:'DeepSeek / Tavily · 去重后保留',date:'2026-10-15',quote:'演示纪要：公司表示将加强回款管理。该表述属于管理层观点，不代表未来现金流已得到验证。'}];
const stages=['规划','资料获取','分析与制图','风险检查','简报撰写','交付检查'];
const stageDescriptions=['拆解研究问题，确定时间范围与数据需求。','并行搜索、读取原件并归纳可追溯证据。','对齐数据口径，计算指标并生成图表。','核对证据、识别分歧与资料缺口。','将已审核的分析组织为带引用的简报。','检查引用定位、图表和结论一致性。'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(text,action,cls='btn')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
function brand(){return '<div class="brand"><span class="brand-mark">r</span><span>Research Copilot</span></div>'}
function taskList(){return tasks.map((t,i)=>`<button class="task ${state.task===i&&(!state.chatOpen||state.chatTask!==null)?'active':''}" data-action="task:${i}"><strong>${esc(t.title)}</strong><span class="task-meta"><span>${t.status==='paused'?'◌ 等待补充资料':t.status==='running'?'◌ 研究中':t.status==='failed'?'× 失败':t.status==='stopped'?'— 已终止':'✓ 已完成'}</span><span>${t.date}</span></span></button>`).join('')}
function navButtons(){return [['research','◫','研究工作区'],['memory','◇','研究记忆'],['skills','⌘','技能']].map(([v,icon,title])=>`<button class="nav ${state.view===v?'active':''}" data-action="view:${v}"><span class="icon">${icon}</span>${title}</button>`).join('')}
function sidebar(){return `<aside class="sidebar">${button('<span class="icon">＋</span> 新建研究','new','btn primary new')}<div class="label">工作空间</div>${navButtons()}<div class="task-section"><div class="label">最近研究</div>${taskList()}</div><div class="sidebar-foot"><div class="row"><span class="avatar">我</span><span>个人研究空间</span></div><p class="tiny" style="margin:14px 0 0">独立思考，有据可循。</p></div></aside>`}
function statusBadge(){if(state.status==='failed')return '<span class="badge amber">任务失败</span>';return state.status==='paused'?'<span class="badge amber"><i class="dot"></i> 等待补充资料</span>':state.status==='running'?'<span class="badge"><i class="dot"></i> 研究进行中</span>':state.status==='stopped'?'<span class="badge gray">已终止</span>':'<span class="badge"><i class="dot"></i> 研究已完成</span>'}
function progress(){let current=state.status==='paused'?1:state.status==='running'?2:5;return `<div class="progress">${stages.map((s,i)=>`<div class="step ${i<current||state.status==='completed'?'done':''} ${i===current?'current':''}"><i>${i<current||state.status==='completed'?'✓':i+1}</i>${s}</div>`).join('')}</div>`}
function demoControls(){return `<div class="sim-controls"><span>演示状态</span><select aria-label="演示任务状态" id="status-select"><option value="completed" ${state.status==='completed'?'selected':''}>已完成</option><option value="paused" ${state.status==='paused'?'selected':''}>需要补资料</option><option value="running" ${state.status==='running'?'selected':''}>研究中</option><option value="stopped" ${state.status==='stopped'?'selected':''}>已终止</option></select><span>全部为虚构演示内容</span></div>`}
function workspaceHeader(){return `<div class="workspace-head"><div class="context-line"><span>研究工作区</span><span>/</span><span>个股与行业研究</span><span class="grow"></span><span class="mono">R-00${state.task+1}</span></div><div class="row between">${statusBadge()}<span class="tiny muted">更新于 10:42</span></div><h1>${esc(tasks[state.task].title)}</h1><p class="muted" style="font-size:12px;margin-bottom:18px">${esc(tasks[state.task].question)}</p><div class="row between"><span class="tiny muted">截至 2026.10.20　·　${esc(tasks[state.task].symbol)}</span><div class="tools">${button('＋ 补充资料','upload','btn small')}${button('↓ 导出简报','export','btn small')}</div></div></div>`}
function chart(){const cash=state.chart==='cash';return `<div class="chart-box"><div class="row between"><span class="chart-title">${cash?'利润与现金流：回款仍需观察':'增长比较：收入领先，现金流滞后'}</span><div class="segmented"><button data-action="chart:growth" class="${!cash?'active':''}">增长</button><button data-action="chart:cash" class="${cash?'active':''}">现金流</button></div></div><div class="legend"><span><i></i>${cash?'净利润':'营业收入'}</span><span><i class="light"></i>经营现金流</span><span class="grow"></span><span>同比 · %</span></div><svg class="chart" viewBox="0 0 550 190" role="img" aria-label="虚构演示图：2023至2025年营业收入及现金流增速"><line class="axis" x1="35" y1="30" x2="535" y2="30"/><line class="axis" x1="35" y1="85" x2="535" y2="85"/><line class="axis" x1="35" y1="140" x2="535" y2="140"/><text x="8" y="34">20</text><text x="8" y="89">10</text><text x="15" y="144">0</text><rect x="88" y="${cash?88:79}" width="38" height="${cash?52:61}" rx="3" fill="var(--accent)"/><rect x="132" y="93" width="38" height="47" rx="3" fill="#b0cfc2"/><rect x="248" y="${cash?69:62}" width="38" height="${cash?71:78}" rx="3" fill="var(--accent)"/><rect x="292" y="78" width="38" height="62" rx="3" fill="#b0cfc2"/><rect x="408" y="${cash?56:37}" width="38" height="${cash?84:103}" rx="3" fill="var(--accent)"/><rect x="452" y="88" width="38" height="52" rx="3" fill="#b0cfc2"/><text x="415" y="${cash?47:28}" style="fill:var(--accent);font-weight:600">${cash?'15.2':'18.6'}</text><text x="459" y="80">9.4</text><text x="108" y="165">2023</text><text x="268" y="165">2024</text><text x="428" y="165">2025</text></svg><div class="row between tiny muted"><span>来源：演示财务快照 [2] · 非真实证券数据</span><button data-action="source:1" style="color:var(--accent);font-size:10px">查看数据 ↗</button></div></div>`}
function report(){return `<article class="paper"><div class="row between"><div class="kicker">RESEARCH BRIEF / 投研简报</div><span class="tiny muted">版本 1.0 · 演示</span></div><h2>${state.task===1?'增长分化之下，关注盈利兑现':state.task===2?'从渠道库存变化，观察经营质量':'增长正在兑现，现金流仍需跟踪'}</h2><div class="row tiny muted"><span>财务分析</span><span>·</span><span>经营质量</span><span>·</span><span>预计阅读 4 分钟</span></div><p class="lead">收入增长与利润改善方向一致，但现金流增速落后。关注应收账款及存货周转，判断增长能否持续转化为经营现金流。<button class="citation" data-action="source:0" aria-label="查看引用1">[1]</button><button class="citation" data-action="source:1" aria-label="查看引用2">[2]</button></p><div class="stats"><div class="stat"><div class="tiny muted">营业收入同比</div><div class="number">18.6<span>%</span></div><span class="tiny muted">增长持续</span></div><div class="stat"><div class="tiny muted">净利润同比</div><div class="number">15.2<span>%</span></div><span class="tiny muted">盈利改善</span></div><div class="stat"><div class="tiny muted">经营现金流同比</div><div class="number">9.4<span>%</span></div><span class="tiny" style="color:var(--warn)">回款滞后</span></div></div>${chart()}<h3 class="subheading"><span>01</span> 增长驱动与经营质量</h3><p>订单交付与产品结构改善共同支撑收入增长。现有资料不足以将增量全部归因于需求扩张，需要结合订单结构进一步验证。行业研究中的乐观判断保留为观点，不直接视为事实。<button class="citation" data-action="source:2" aria-label="查看引用3">[3]</button></p><h3 class="subheading"><span>02</span> 风险与不确定性</h3><p>现金流与利润的差距值得持续观察。若回款改善不及预期，或库存周转继续放缓，增长质量判断需要调整。<button class="citation" data-action="source:3" aria-label="查看引用4">[4]</button></p><div class="report-note">原型示意：公司、财务指标与资料均为虚构，仅用于评估界面。此处不构成研究结论。</div></article>`}
function review(){return `<section class="review"><div class="row between"><h2>还需要一份资料，才能继续分析</h2><span class="badge amber">资料获取阶段</span></div><p>当前缺少同一报告期的现金流量表。已有收入与利润数据仍会保留，补充资料后重新执行受影响的分析与风险检查。</p><label><input type="radio" name="resolve" value="upload" checked> 补充现金流量表或包含该表的年报</label><label><input type="radio" name="resolve" value="scope"> 缩小范围，仅比较收入和利润</label><div class="actions">${button('补充资料','upload','btn primary')}${button('按选择继续','resume','btn')}${button('终止研究','stop','btn')}</div>${state.uploads.length?`<div class="bottom-note">已补充：${state.uploads.map(esc).join('、')}（仅演示）</div>`:''}</section>`}
function events(){let entries=[['10:25','研究计划已生成','关注增长来源、利润兑现和现金流匹配。'],['10:29','资料获取完成','CNEquity 查询快照 + 双路搜索，保留演示资料。'],['10:34','财务分析与制图完成','使用财务分析技能，计算结果和图表分别归档。'],['10:37','风险检查完成','现金流差异已在简报中明确说明。'],['10:40','简报已生成','保留风险与资料限制，完成正文编排。'],['10:42','交付检查完成','引用定位与图表已检查。']];if(state.status==='paused')entries=[entries[0],['10:29','等待补充资料','缺少同一报告期的现金流量表，研究已暂停。']];if(state.status==='running')entries=[entries[0],entries[1],['当前','分析与制图进行中','流程演示，不会自动完成或发起真实调用。']];if(state.status==='stopped')entries=[entries[0],['当前','研究已终止','已有资料保留，未完成阶段不会显示为通过。']];return `<div class="timeline">${entries.reverse().map(([t,h,d])=>`<div class="event"><time>${t}</time><strong>${h}</strong><p>${d}</p></div>`).join('')}</div>`}

function content(){return `${state.status==='paused'?review():state.status==='running'?`<div class="warning"><strong>正在分析与制图</strong>这是静态流程演示，未启动真实研究。可通过上方“演示状态”切换结果。</div>`:state.status==='stopped'?'<div class="warning"><strong>研究已终止</strong>演示资料与已有产物保留在当前页面，刷新后重置。</div>':''}<div class="tabs"><button class="tab ${state.tab==='report'?'active':''}" data-action="tab:report">${state.status==='completed'?'研究简报':'简报预览'}</button><button class="tab ${state.tab==='timeline'?'active':''}" data-action="tab:timeline">研究过程</button><button class="tab ${state.tab==='skills'?'active':''}" data-action="tab:skills">使用的技能 <span class="tiny muted">2</span></button></div>${state.tab==='timeline'?events():state.tab==='skills'?usedSkills():report()}`}
function usedSkills(){return `<div class="paper"><h2>本次研究的方法</h2><div class="source"><div class="row between"><strong>财务分析</strong><span class="badge">用户指定</span></div><p>对齐报告期，比较收入、利润与经营现金流。</p></div><div class="source"><div class="row between"><strong>财务图表</strong><span class="badge gray">系统补充</span></div><p>将关键指标转为可比较的图表，保留计算数据。</p></div><p class="tiny muted">技能提供研究方法。执行权限和审核规则由工作流程约束。</p></div>`}
function sourceList(){return sources.map((s,i)=>`<button class="source ${state.source===i?'selected':''}" data-action="source:${i}"><div class="row"><span class="file-icon">${s.type}</span><strong>${esc(s.name)}</strong></div><p>${s.detail}</p></button>`).join('')}

const experiences=[
 {id:'seed-success',taskId:'demo-1',title:'先统一报告期，再比较增长指标',outcome:'success',enabled:true,taskTitle:'华辰制造：增长的质量',lesson:'同口径对齐后再计算，可以减少收入、利润和现金流的错误比较。',evidence:'演示记录：分析阶段完成口径对齐，交付检查通过。',scope:'适用于跨公司或跨期财务比较；仍需核对各数据来源。'},

function experienceCards(){return `<div class="experience-grid">${experiences.map((m,i)=>`<article class="experience-card"><div class="row between"><span class="badge ${m.outcome==='success'?'':m.outcome==='failure'?'amber':'gray'}">${{success:'成功经验',failure:'失败教训',stopped:'终止复盘'}[m.outcome]}</span><button role="switch" aria-label="启用经验 ${esc(m.title)}" aria-checked="${m.enabled}" class="switch ${m.enabled?'on':''}" data-action="experience-toggle:${i}"></button></div><h3>${esc(m.title)}</h3><p>${esc(m.lesson)}</p><div class="experience-scope"><strong>适用边界</strong><p>${esc(m.scope)}</p></div><div class="row between"><span class="tiny muted">来源：${esc(m.taskTitle)}</span>${button('查看依据 ↗','experience-detail:'+i,'btn small')}</div></article>`).join('')}</div>`}
function management(){const view=state.view;return `<main class="management"><div class="context-line">个人研究空间 / ${view==='memory'?'长期记忆':'技能'}</div><h1>${view==='memory'?'长期记忆':'技能'}</h1><p class="muted">${view==='memory'?'记住资料中的知识，也记住研究过程中奏效与失效的方法。':'选择研究方法，让系统按问题补充所需能力。'}</p>${view==='memory'?`<div class="tabs"><button class="tab ${state.memoryTab==='experience'?'active':''}" data-action="memory-tab:experience">任务经验 <span class="tiny muted">${experiences.length}</span></button><button class="tab ${state.memoryTab==='knowledge'?'active':''}" data-action="memory-tab:knowledge">研报知识</button></div><div class="memory-notice">任务会话结束后在后台总结，不阻塞简报交付。仅有依据、适用边界明确的经验进入长期记忆。</div>${state.memoryTab==='experience'?experienceCards():`<div class="table"><table><thead><tr><th>研报观点</th><th>来源与定位</th><th>日期</th><th>可召回</th></tr></thead><tbody><tr><td><strong>设备订单恢复，但回款存在滞后</strong><p class="tiny muted">原研报观点，不是当前事实</p></td><td>行业景气跟踪 · 第 6–8 页</td><td>2026-09-30</td><td><button role="switch" aria-checked="${state.memory}" aria-label="启用研究记忆" class="switch ${state.memory?'on':''}" data-action="memory-toggle"></button></td></tr></tbody></table></div>`}<p class="bottom-note">以上均为演示记忆。原型仅保存本次页面会话，不调用模型或数据库。</p>`:`<div class="skill-grid">${[['财务分析','对齐报告期与指标口径，比较收入、利润和现金流。','指令 · 模板 · 可信脚本'],['行业对比','对比代表公司的经营差异，保留不同观点与不确定性。','指令 · 模板'],['财务图表','将计算结果转为简报图表，并保留可核对的数据。','指令 · 可信脚本']].map(([h,p,t],i)=>`<div class="skill-card"><div class="row between"><span class="icon">${['▥','◫','⌁'][i]}</span><button role="switch" aria-label="启用${h}" aria-checked="${state.skills[i]}" class="switch ${state.skills[i]?'on':''}" data-action="skill:${i}"></button></div><h3>${h}</h3><p>${p}</p><span class="tiny muted">${t}</span></div>`).join('')}</div><div class="bottom-note">可显式指定；系统也可按需发现。首版仅支持项目维护的可信脚本。</div>`}</main>`}
function reflectionBanner(task){if(!task?.reflection)return '';const r=task.reflection;return `<section class="reflection-banner" aria-live="polite"><div class="row between"><strong>${{queued:'经验总结已排队',running:'正在后台总结本次经验',saved:'本次经验已写入长期记忆',failed:'经验总结失败'}[r.status]}</strong><span class="badge gray">后台任务 · 演示</span></div><p>${{queued:'会话已结束，已有简报与资料仍可查看。',running:'正在回顾过程、成功做法和失败原因，不影响已有结果。',saved:'保留任务来源和适用条件，供后续研究参考。',failed:'研究结果不受影响，尚未写入任何新经验，可单独重试总结。'}[r.status]}</p>${r.status==='saved'?button('查看任务经验 ↗','view-experience','btn small'):r.status==='failed'?button('重试经验总结','retry-reflection','btn small'):''}</section>`}
function finishSession(){const task=tasks[state.task];const outcome=document.getElementById('session-outcome').value;const simulateFailure=document.getElementById('summary-failure').checked;task.ended=true;task.outcome=outcome;task.status={success:'completed',failure:'failed',stopped:'stopped'}[outcome];state.status=task.status;closeModal();queueReflection(task,simulateFailure)}
function queueReflection(task,fail=false){if(['queued','running','saved'].includes(task.reflection?.status))return;task.reflection={status:'queued'};render();setTimeout(()=>{task.reflection.status='running';render();setTimeout(()=>{if(fail){task.reflection.status='failed';render();return}if(!experiences.some(m=>m.id==='summary-'+task.id)){const success=task.outcome==='success';experiences.unshift({id:'summary-'+task.id,taskId:task.id,taskTitle:task.title,outcome:task.outcome,enabled:true,title:success?'保留口径与引用，再组织研究结论':task.outcome==='failure'?'先定位失败阶段，再决定补充或重试':'保留中断上下文，避免重复研究',lesson:success?'演示经验：在组织结论前明确数据口径并关联原始资料，便于交付检查。':'演示经验：区分资料缺失、调用失败和主动终止，保留已完成的工作；无法确认的根因应标为未知。',evidence:'本条为固定演示摘要，任务结果由演示控件选择，未读取真实日志或调用模型。',scope:'仅用于展示经验记录结构，不能作为已验证的研究方法或金融事实。'})}task.reflection.status='saved';render()},1100)},500)}

function chatWorkspace(){const task=state.chatTask===null?null:tasks[state.task];const turns=task?.turns||[];return `<main class="b-main chat-main"><div class="chat-titlebar"><div class="row"><span class="chat-indicator"></span><span>${task?'研究对话':'新建研究'}</span></div><div class="row"><span class="tiny muted">个人研究空间 · A 股</span>${task&&!task.ended?button('结束会话','end-session','btn small'):''}</div></div>${reflectionBanner(task)}${turns.length?`<div class="conversation" aria-live="polite">${turns.map(t=>t.role==='user'?`<div class="message user-message"><div class="message-meta">你 <span>刚刚</span></div><p>${esc(t.text)}</p>${t.files.length?`<div class="message-files">${t.files.map(f=>`<span>▤ ${esc(f)}</span>`).join('')}</div>`:''}${t.skills.length?`<div class="message-skills">指定技能：${t.skills.map(i=>chatSkills[i]).join(' · ')}</div>`:''}</div>`:`<div class="message assistant-message"><div class="message-meta"><span class="assistant-mark">r</span> Research Copilot <span>演示回复</span></div><p>${esc(t.text)}</p>${t.plan?`<div class="chat-plan"><div class="row between"><strong>研究计划</strong><span class="badge gray">等待真实服务接入</span></div><ol><li>明确研究范围与报告期，核对可用资料。</li><li>结合指定技能进行分析，保留引用与计算依据。</li><li>检查证据和风险，形成带图表的投研简报。</li></ol><div class="row between"><span class="tiny muted">资料不足时，会在这里请你补充。</span>${button('查看过程 ↗','chat-process','btn small')}</div></div>`:''}</div>`).join('')}</div>`:`<section class="chat-welcome"><div class="chat-emblem">r<span>研究，由一个好问题开始</span></div><h1>今天，想研究什么？</h1><p>提出一个问题，带上你的资料。<br>从线索到证据，再到清晰的投研判断。</p><div class="suggestions"><button data-action="suggest:0"><span>个股研究</span>利润增长，有现金流支撑吗？<b>↗</b></button><button data-action="suggest:1"><span>行业对比</span>三家公司的经营质量有何不同？<b>↗</b></button></div></section>`}<section class="chat-composer ${task?.ended?'session-ended':''}" aria-label="研究消息输入区">${task?.ended?'<div class="ended-note">本次会话已结束。可以查看记录，或新建研究。</div>':''}<div class="composer-files">${state.draftFiles.map((f,i)=>`<span class="attachment-chip"><span class="file-icon">文件</span><span>${esc(f)}</span><button aria-label="移除附件 ${esc(f)}" data-action="remove-file:${i}">×</button></span>`).join('')}</div><textarea id="chat-input" ${task?.ended?'disabled':''} aria-label="研究问题或补充消息" placeholder="输入研究问题，或补充你的想法…" rows="4">${esc(state.draft)}</textarea><div class="selected-skills">${state.draftSkills.map(i=>`<button data-action="draft-skill:${i}" title="移除技能">⌘ ${chatSkills[i]} <span>×</span></button>`).join('')}</div>${state.skillPicker?`<div class="skill-picker"><div class="row between"><strong>选择本次消息使用的技能</strong><button data-action="pick-skills" aria-label="关闭技能选择">×</button></div><p class="tiny muted">可多选；系统仍可按问题补充相关技能。</p>${chatSkills.map((name,i)=>`<button class="skill-option ${state.draftSkills.includes(i)?'chosen':''}" data-action="draft-skill:${i}" aria-pressed="${state.draftSkills.includes(i)}"><span>${name}</span><small>${['对齐财务口径，检查增长质量','比较同业差异与风险','用图表呈现可核对的计算结果'][i]}</small><b>${state.draftSkills.includes(i)?'✓':'＋'}</b></button>`).join('')}</div>`:''}<div class="composer-toolbar"><div class="row"><button class="composer-tool" data-action="attach-chat" aria-label="添加附件"><span>＋</span> 附件</button><button class="composer-tool ${state.skillPicker?'selected':''}" data-action="pick-skills" aria-expanded="${state.skillPicker}"><span>⌘</span> 技能${state.draftSkills.length?' · '+state.draftSkills.length:''}</button></div><div class="row"><span class="tiny muted keyboard-hint">Enter 发送 · Shift+Enter 换行</span><button class="send-message" data-action="send-chat" aria-label="发送研究消息" ${!state.draft.trim()||task?.ended?'disabled':''}>↑</button></div></div><input type="file" id="chat-files" multiple hidden accept=".pdf,.md,.txt,.csv,.xlsx,.json"></section><div class="chat-footnote">原型演示 · 附件仅记录文件名，不上传、不解析 · 消息不会调用真实模型</div></main><aside class="chat-context"><div class="b-section-title">研究上下文</div><p class="tiny muted">资料和方法，与问题一起出发。</p><div class="context-block"><div class="row between"><span>本次资料</span><span class="mono tiny">${task?.files?.length||0}</span></div>${task?.files?.length?task.files.map(f=>`<div class="context-file">▤ ${esc(f)}<small>演示附件 · 未解析</small></div>`).join(''):'<p>添加研报、调研笔记或数据文件，发送后会出现在这里。</p>'}</div><div class="context-block"><span>研究方法</span><p>${task?.selectedSkills?.length?task.selectedSkills.map(i=>chatSkills[i]).join('、'):'按问题自动发现技能；也可以在输入区指定。'}</p></div><div class="context-block"><span>如何推进</span><div class="context-path"><span>提出问题</span><i>↓</i><span>获取资料与分析</span><i>↓</i><span>风险检查与简报</span></div></div>${task?button('阅读简报示例 ↗','chat-report','btn small'):''}</aside>`}
function updateChatRoute(open){let url=new URL(location.href);if(open)url.searchParams.set('view','new');else url.searchParams.delete('view');history.replaceState(null,'',url)}
function sendChat(){if(state.chatTask!==null&&tasks[state.task].ended)return;const text=state.draft.trim();if(!text)return;if(state.chatTask===null){tasks.unshift({id:crypto.randomUUID(),title:text,question:text,symbol:'新建研究 · 演示',date:'刚刚',status:'running',turns:[],files:[],selectedSkills:[]});state.task=0;state.chatTask=tasks[0];state.status='running'}const task=tasks[state.task];task.turns ||= [];task.files ||= [];task.selectedSkills ||= [];task.turns.push({role:'user',text,files:[...state.draftFiles],skills:[...state.draftSkills]});task.files=[...new Set([...task.files,...state.draftFiles])];task.selectedSkills=[...new Set([...task.selectedSkills,...state.draftSkills])];const first=task.turns.length===1;task.turns.push({role:'assistant',text:first?'已记录你的研究问题、所选技能与附件。下面展示拟采用的研究步骤；此原型不会读取附件或开始真实研究。':'补充消息已记录到当前研究对话。正式产品将结合新增资料和要求更新研究；此处仅演示对话交互。',plan:first});state.draft='';state.draftFiles=[];state.draftSkills=[];state.skillPicker=false;render();requestAnimationFrame(()=>document.getElementById('chat-input')?.scrollIntoView({block:'nearest'}))}

function VariantC(){return `<div class="c-shell"><aside class="c-rail"><div class="brand-mark">r</div>${[['research','◫','研究'],['memory','◇','记忆'],['skills','⌘','技能']].map(([v,i,t])=>`<button class="rail-btn ${state.view===v?'active':''}" data-action="view:${v}"><span class="icon">${i}</span>${t}</button>`).join('')}<span class="grow"></span><span class="avatar">我</span></aside><div class="c-body"><header class="c-header"><div class="row between"><span class="tiny muted">RESEARCH COPILOT / 研究工作区</span><div class="row"><span class="prototype-tag">界面原型</span>${button('＋ 新建研究','new','btn primary small')}</div></div><h1>${state.view==='research'?esc(tasks[state.task].title):{memory:'研究记忆',skills:'技能'}[state.view]}</h1></header>${state.view==='research'?`<main class="c-main"><div class="c-taskstrip">${taskList()}</div><div class="row between" style="margin-bottom:16px">${statusBadge()}${demoControls()}</div><div class="flow-board">${stages.map((s,i)=>`<button class="stage-card ${state.stage===i?'active':''}" data-action="stage:${i}"><div class="stage-num">${String(i+1).padStart(2,'0')} / ${state.status==='completed'?'已完成':state.status==='stopped'?'已终止':i<(state.status==='paused'?1:2)?'已完成':i===(state.status==='paused'?1:2)?(state.status==='paused'?'等待补充':'进行中'):'未开始'}</div><strong>${s}</strong><small>${['研究范围与计划','数据、研报与搜索','计算结果与图表','风险与证据缺口','图文研究简报','引用与一致性'][i]}</small></button>`).join('')}</div><div class="c-stage-info"><div class="row between"><strong>${stages[state.stage]}</strong>${button('查看阶段记录','tab:timeline','btn small')}</div><p>${stageDescriptions[state.stage]}</p></div><div class="c-columns"><section>${content()}</section>${inspector()}</div></main>`:management()}</div></div>`}
function render(){document.body.className='page-'+state.variant.toLowerCase();document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC})[state.variant]();renderSwitcher();console.info('PROTOTYPE STATE',JSON.parse(JSON.stringify(state)));}
function renderSwitcher(){let relevant={方案:state.variant,页面:state.view,任务:state.chatOpen&&state.chatTask===null?'尚未创建':tasks[state.task].title,状态:state.chatOpen&&state.chatTask===null?'draft':state.status,内容页签:state.tab,证据页签:state.panel,当前引用:state.source+1,图表:state.chart,阶段:stages[state.stage],记忆启用:state.memory,技能启用:state.skills,上传文件:state.uploads,搜索:state.query,对话入口:state.chatOpen,消息草稿:state.draft,待发送附件:state.draftFiles,待发送技能:state.draftSkills.map(i=>chatSkills[i]),后台总结:tasks[state.task].reflection||null,任务经验数量:experiences.length,记忆分类:state.memoryTab,对话消息:state.chatTask===null?[]:(tasks[state.task].turns||[])};document.getElementById('floating').innerHTML=`${state.showState?`<div class="state-panel"><div class="row between"><strong>原型状态 · 仅内存</strong><button data-action="state">关闭 ×</button></div><pre>${esc(JSON.stringify(relevant,null,2))}</pre></div>`:''}<div class="switcher" aria-label="原型方案切换"><button data-action="prev" aria-label="上一个方案">←</button><div class="variant"><small>PROTOTYPE · ${state.variant} / 3</small>${variants[state.variant]}</div><button data-action="next" aria-label="下一个方案">→</button><span class="state-summary">${{research:'研究',memory:'记忆',skills:'技能'}[state.view]} · ${state.chatOpen&&state.chatTask===null?'待发送':{completed:'完成',paused:'待补资料',running:'研究中',failed:'失败',stopped:'已终止'}[state.status]}</span><button class="state-btn" data-action="state">查看状态</button></div>`}
function switchVariant(d){let keys=Object.keys(variants);state.variant=keys[(keys.indexOf(state.variant)+d+3)%3];let url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render()}
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,3300)}
function modal(html){let el=document.getElementById('modal');el.innerHTML=html;el.showModal()}
function closeModal(){document.getElementById('modal').close()}
function download(name,body,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function showPreview(){modal(`<div class="row between"><h2>${sources[state.source].name}</h2>${button('×','close','btn small')}</div><p class="tiny muted">${sources[state.source].detail} · 原文定位示意</p><div class="source-preview"><div class="tiny muted">演示原文 · 不是真实研报</div><p><mark>${sources[state.source].quote}</mark></p></div><div class="modal-foot">${button('返回研究','close','btn primary')}</div>`)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let [a,arg]=b.dataset.action.split(':');if(a==='memory-tab'){state.memoryTab=arg;render();return}if(a==='experience-toggle'){experiences[+arg].enabled=!experiences[+arg].enabled;render();return}if(a==='experience-detail'){let m=experiences[+arg];modal(`<div class="row between"><h2>${esc(m.title)}</h2>${button('×','close','btn small')}</div><p class="muted">来源任务：${esc(m.taskTitle)}</p><h3>可核对依据</h3><p>${esc(m.evidence)}</p><h3>适用边界</h3><p>${esc(m.scope)}</p><div class="modal-foot">${button('关闭','close','btn primary')}</div>`);return}if(a==='view-experience'){state.view='memory';state.memoryTab='experience';render();return}if(a==='end-session'){if(tasks[state.task].ended)return;modal(`<h2>结束本次研究会话</h2><p class="muted">结束后在后台总结成功做法与失败教训，已有研究结果仍可查看。</p><label for="session-outcome">演示任务结果</label><select id="session-outcome"><option value="success">成功完成（演示）</option><option value="failure">任务失败（演示）</option><option value="stopped">用户终止（演示）</option></select><label><input id="summary-failure" type="checkbox"> 演示：模拟后台总结失败</label><p class="tiny muted">正式产品根据交付与执行记录判定结果，不以手动选择作为成功证据。</p><div class="modal-foot">${button('取消','close')}${button('结束并后台总结','finish-session','btn primary')}</div>`);return}if(a==='finish-session'){finishSession();return}if(a==='retry-reflection'){queueReflection(tasks[state.task]);return}if(a==='prev'||a==='next'){switchVariant(a==='prev'?-1:1);return}if(a==='state'){state.showState=!state.showState;renderSwitcher();return}if(a==='close'){closeModal();return}if(a==='new'){state.variant='B';state.view='research';state.chatOpen=true;state.chatTask=null;state.draft='';state.draftFiles=[];state.draftSkills=[];state.skillPicker=false;let url=new URL(location.href);url.searchParams.set('variant','B');url.searchParams.set('view','new');history.replaceState(null,'',url);render();window.scrollTo(0,0);document.getElementById('chat-input').focus();return}if(a==='upload'){modal(`<div class="row between"><h2>补充研究资料</h2>${button('×','close','btn small')}</div><p class="muted tiny">原型仅记录文件名，不读取内容、不上传文件。</p><div class="upload-box"><p>选择研报、笔记或数据文件</p><input id="files" type="file" multiple aria-label="选择演示资料"></div><div class="modal-foot">${button('使用示例年报','sample-upload')}${button('确认选择','save-upload','btn primary')}</div>`);return}if(a==='sample-upload'||a==='save-upload'){let names=a==='sample-upload'?['补充现金流量表_演示.pdf']:Array.from(document.getElementById('files').files).map(f=>f.name);if(!names.length){notify('请先选择文件，或使用示例年报');return}state.uploads.push(...names);closeModal();render();notify('已记录文件名，仅用于模拟补充资料');return}if(a==='resume'){let choice=document.querySelector('input[name=resolve]:checked')?.value;if(choice==='upload'&&!state.uploads.length){notify('请先补充资料，或选择缩小研究范围');return}state.status='running';tasks[state.task].status='running';state.tab='timeline';render();notify(choice==='scope'?'已模拟缩小范围，保留现金流证据缺口':'已模拟恢复，将重新分析并检查风险');return}if(a==='stop'){state.status='stopped';tasks[state.task].status='stopped';render();return}if(a==='open-chat'){state.chatOpen=true;state.chatTask=tasks[state.task];state.view='research';updateChatRoute(true);render();return}if(a==='chat-process'||a==='chat-report'){state.chatOpen=false;state.tab=a==='chat-process'?'timeline':'report';updateChatRoute(false);render();return}if(a==='pick-skills'){state.skillPicker=!state.skillPicker;render();return}if(a==='draft-skill'){let i=+arg;state.draftSkills=state.draftSkills.includes(i)?state.draftSkills.filter(x=>x!==i):[...state.draftSkills,i];render();return}if(a==='attach-chat'){document.getElementById('chat-files').click();return}if(a==='remove-file'){state.draftFiles.splice(+arg,1);render();return}if(a==='suggest'){state.draft=+arg===0?'分析一家 A 股公司的营收、利润与现金流增长是否匹配，并说明主要风险。':'对比三家 A 股同行业公司的增长、盈利与估值，分析经营质量差异。';render();document.getElementById('chat-input').focus();return}if(a==='send-chat'){sendChat();return}if(a==='view'){state.view=arg;state.query='';render();window.scrollTo(0,0);return}if(a==='task'){state.task=+arg;state.chatOpen=!!tasks[state.task].turns;state.chatTask=state.chatOpen?tasks[state.task]:null;state.draft='';state.draftFiles=[];state.draftSkills=[];updateChatRoute(state.chatOpen);state.status=tasks[state.task].status;state.tab='report';state.view='research';state.uploads=[];render();return}if(a==='tab'){state.tab=arg;render();return}if(a==='panel'){state.panel=arg;render();return}if(a==='source'){state.source=+arg;state.panel='sources';render();notify(`已定位引用 [${+arg+1}] · ${sources[+arg].detail}`);return}if(a==='document'){state.source=+arg;showPreview();return}if(a==='preview'){showPreview();return}if(a==='chart'){state.chart=arg;render();return}if(a==='stage'){state.stage=+arg;render();return}if(a==='memory-toggle'){state.memory=!state.memory;render();notify(state.memory?'记忆已启用（演示）':'记忆已停用，后续研究不再召回（演示）');return}if(a==='skill'){state.skills[+arg]=!state.skills[+arg];render();return}if(a==='export'){download('研究简报_原型演示.md','# '+tasks[state.task].title+'\n\n> 虚构演示，非真实研究结论。\n\n收入增长与利润改善方向一致，但现金流增速落后。\n\n![增长比较](增长比较_演示.svg)\n\n图表请从原型产物面板单独下载。\n\n来源：虚构年报、财务快照、研报及交流纪要。','text/markdown;charset=utf-8');notify('已导出演示 Markdown；图表可在产物面板下载');return}if(a==='chart-download'){let svg=new DOMParser().parseFromString(chart(),'text/html').querySelector('.chart').outerHTML.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ').replaceAll('var(--accent)','#267969').replace('role="img"','style="background:white;font-family:sans-serif;font-size:10px" role="img"').replaceAll('class="axis"','stroke="#e3e9e5" stroke-dasharray="3 4"');download('增长比较_演示.svg',svg,'image/svg+xml');return}if(a==='data-download'){download('财务指标_演示.csv','\ufeff年份,营收增速,经营现金流增速\n2023,11.1,8.5\n2024,14.2,11.3\n2025,18.6,9.4','text/csv;charset=utf-8');return}if(a==='panel-modal'){modal(`<h2>本次研究产物</h2><p>增长比较.svg · 财务指标.csv · 研究简报.md</p><p class="muted">研究记忆：行业景气观点，第 6–8 页。</p><div class="modal-foot">${button('返回','close','btn primary')}</div>`);return}});
document.addEventListener('change',e=>{if(e.target.id==='chat-files'){state.draftFiles=[...new Set([...state.draftFiles,...Array.from(e.target.files).map(f=>f.name)])];render();return}if(e.target.id==='status-select'){state.status=e.target.value;tasks[state.task].status=state.status;render()}});
document.addEventListener('input',e=>{if(e.target.id==='chat-input'){state.draft=e.target.value;document.querySelector('[data-action=send-chat]').disabled=!state.draft.trim()||(state.chatTask!==null&&tasks[state.task].ended);renderSwitcher();return}});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat();return}if(document.getElementById('modal').open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowLeft'?-1:1)}});
window.addEventListener('popstate',()=>{state.variant=new URLSearchParams(location.search).get('variant')||'B';state.chatOpen=new URLSearchParams(location.search).get('view')==='new';if(!variants[state.variant])state.variant='A';render()});
render();
</script></body></html>
