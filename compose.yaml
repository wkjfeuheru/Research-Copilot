name: research-copilot

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-research_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_copilot_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      RC_ENVIRONMENT: production
      # 应用当前不会连接数据库；该地址仅说明后续接入位置。
      RC_DATABASE_URL: postgresql://${POSTGRES_USER:-research_copilot}:${POSTGRES_PASSWORD:-research_copilot_local_dev}@postgres:5432/${POSTGRES_DB:-research_copilot}
      # 真实模型配置；未设置 key 时模型状态为未配置，不会发起调用。
      RC_RESEARCH_MODEL: ${RC_RESEARCH_MODEL:-deepseek-flash}
      RC_RESEARCH_MODEL_BASE_URL: ${RC_RESEARCH_MODEL_BASE_URL:-https://api.deepseek.com}
      RC_RESEARCH_MODEL_API_KEY: ${RC_RESEARCH_MODEL_API_KEY:-}
      RC_RESEARCH_MODEL_TIMEOUT_SECONDS: ${RC_RESEARCH_MODEL_TIMEOUT_SECONDS:-60}
      RC_RESEARCH_MODEL_MAX_TOKENS: ${RC_RESEARCH_MODEL_MAX_TOKENS:-8192}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
