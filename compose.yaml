name: research-copilot

# 只启动 PostgreSQL。Web API 与前端由本机 `uv run rc serve` / `pnpm dev` 启动，
# 不放进 Compose；deploy/ 仍是旧部署配置，本期未验收。
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-research_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_copilot_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 只监听宿主机回环地址；端口可配置，避免与本机其他 PostgreSQL 实例冲突。
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data: