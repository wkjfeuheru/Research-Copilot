[project]
name = "research-copilot"
version = "0.1.0"
description = "A 股个股与行业研究的投研工作区（Planner 单节点骨架）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=0.6,<2.0",
    "openai>=2,<3",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.8,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
